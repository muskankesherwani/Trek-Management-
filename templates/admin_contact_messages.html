<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Contact Page</title>
</head>

<body>
    {% extends "base.html" %}
    {% block content %}
    <div class="container mt-4">
        <h2 class="mb-4">
            📩 Contact Messages
        </h2>
        <div class="card shadow">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Subject</th>
                                <th>Message</th>
                                <th>Date</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for m in messages %}
                            <tr>
                                <td>{{ m[0] }}</td>
                                <td>{{ m[1] }}</td>
                                <td>{{ m[2] }}</td>
                                <td>{{ m[3] }}</td>
                                <td>{{ m[4] }}</td>
                                <td>{{ m[5] }}</td>
                                <td>
                                    <a href="/admin/delete-message/{{ m[0] }}" class="btn btn-danger btn-sm">
                                        Delete
                                    </a>
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    {% endblock %}
</body>

</html>
