<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Edit Profile</title>
</head>
<body>
{% extends "base.html" %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-header bg-dark text-white">
        <h3>Edit Profile</h3>
    </div>
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">
                    Name
                </label>
                <input
                    type="text"
                    name="name"
                    class="form-control"
                    value="{{ staff[1] }}"
                    required>
            </div>
            <div class="mb-3">
                <label class="form-label">
                    Email
                </label>
                <input
                    type="email"
                    name="email"
                    class="form-control"
                    value="{{ staff[2] }}"
                    required>
            </div>
            <div class="mb-3">
                <label class="form-label">
                    Phone
                </label>
                <input
                    type="text"
                    name="phone"
                    class="form-control"
                    value="{{ staff[4] }}"
                    required>
            </div>
            <button
                class="btn btn-success">
                Save Changes
            </button>
            <a
                href="/staff/profile"
                class="btn btn-secondary">
                Cancel
            </a>
        </form>
    </div>
</div>
{% endblock %}
</body>
</html>
